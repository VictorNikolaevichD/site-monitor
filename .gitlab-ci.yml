workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"

stages:
  - test

default:
  image: golang:1.26
  interruptible: true

variables:
  CGO_ENABLED: "0"
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.gocache
  GOMODCACHE: $CI_PROJECT_DIR/.go/pkg/mod

cache:
  key:
    files:
      - go.sum
  paths:
    - .go/pkg/mod
    - .gocache

test:
  stage: test
  script:
    - go test -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 7 days

lint:
  stage: test
  image: golangci/golangci-lint:v2.13.1
  script:
    - golangci-lint run ./...
