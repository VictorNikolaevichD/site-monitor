syntax = "proto3";

package monitor.v1;

option go_package = "github.com/ViktorNikolaevichD/site-monitor/gen/go/monitor/v1;monitorv1";

import "google/protobuf/timestamp.proto";

message Site {
  string id = 1;
  string url = 2;
  string name = 3;
}

message CheckResult {
  int64 id = 1;
  string availability = 2;
  int32 code = 3;
  google.protobuf.Timestamp checked_at = 4;
  int64 duration_ms = 5;
  string error = 6;
}

message GetSitesRequest {}

message GetSiteResponse {
  Site site = 1;
}

message CreateSiteResponse {
  Site site = 1;
}

message DeleteSiteResponse {}

message GetSitesResponse {
  repeated Site sites = 1;
}

message GetSiteRequest {
  string id = 1;
}

message CreateSiteRequest {
  string url = 1;
  string name = 2;
}

message DeleteSiteRequest {
  string id = 1;
}

message GetSiteStatusRequest {
  string id = 1;
}

message GetSiteStatusResponse {
  string url = 1;
  string availability = 2;
  int32 code = 3;
  google.protobuf.Timestamp checked_at = 4;
  int64 duration_ms = 5;
  string error = 6;
}

message GetSiteHistoryRequest {
  string id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetSiteHistoryResponse {
  repeated CheckResult results = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

service MonitorService {
  rpc GetSites(GetSitesRequest) returns (GetSitesResponse);
  rpc GetSite(GetSiteRequest) returns (GetSiteResponse);
  rpc CreateSite(CreateSiteRequest) returns (CreateSiteResponse);
  rpc DeleteSite(DeleteSiteRequest) returns (DeleteSiteResponse);
  rpc GetSiteStatus(GetSiteStatusRequest) returns (GetSiteStatusResponse);
  rpc GetSiteHistory(GetSiteHistoryRequest) returns (GetSiteHistoryResponse);
}
