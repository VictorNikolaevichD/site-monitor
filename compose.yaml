services:
  site-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - "./configs/sites.yaml:/configs/sites.yaml:ro"
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - monitor-network

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "monitor"
      POSTGRES_PASSWORD: "monitor"
      POSTGRES_DB: "site_monitor_db"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d site_monitor_db"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - monitor-network

networks:
  monitor-network:
    driver: bridge
